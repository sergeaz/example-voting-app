<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{{option_a}} vs {{option_b}}!</title>
    <meta name = "viewport" content = "width=device-width, initial-scale = 1.0">
    <link rel='stylesheet' href="{{ url_for('static',filename='stylesheets/style.css') }}" />
  </head>
  <body>
    <div id="content-container">
      <div id="content-container-center">
        {% if not setup_done %}
          <h3>Create a comparison</h3>
          <form id="setup" method="POST" action="/set_options">
            <input type="text" name="option_a" placeholder="First option" required maxlength="64" />
            <input type="text" name="option_b" placeholder="Second option" required maxlength="64" />
            <button type="submit">Add to comparison</button>
          </form>
        {% else %}
          <h3>{{option_a}} vs {{option_b}}!</h3>
          <form id="choice" name='form' method="POST" action="/">
            <button id="a" type="submit" name="vote" class="a" value="a">{{option_a}}</button>
            <button id="b" type="submit" name="vote" class="b" value="b">{{option_b}}</button>
          </form>
          <form method="POST" action="/reset" style="margin-top:10px;">
            <button type="submit">Reset comparison</button>
          </form>
          <div id="tip">(Tip: you can change your vote)</div>
          <div id="hostname">Processed by container ID {{hostname}}</div>
        {% endif %}
      </div>
    </div>

    <script src="http://code.jquery.com/jquery-latest.min.js" type="text/javascript"></script>

    {% if vote %}
    <script>
      var vote = "{{vote}}";
      if(vote == "a"){
        $(".a").prop('disabled', true);
        $(".a").html('{{option_a}} <i class="fa fa-check-circle"></i>');
        $(".b").css('opacity','0.5');
      }
      if(vote == "b"){
        $(".b").prop('disabled', true);
        $(".b").html('{{option_b}} <i class="fa fa-check-circle"></i>');
        $(".a").css('opacity','0.5');
      }
    </script>
    {% endif %}
  </body>
</html>
